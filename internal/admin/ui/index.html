<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GATRA Policy Engine</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --brand: #2563eb;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --border: #e2e8f0;
      --code-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 3rem 1.5rem;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand);
      background: #eff6ff;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      border: 1px solid #dbeafe;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
      margin: 0 0 0.25rem 0;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.75rem;
      margin-bottom: 2rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.02);
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 1.25rem 0;
      color: var(--primary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    th, td {
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.825em;
      border: 1px solid var(--border);
    }

    .btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 0.35rem 0.75rem;
      font-weight: 500;
      border-radius: 4px;
    }

    .btn-danger:hover {
      background: #fef2f2;
      color: var(--danger-hover);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 0.875rem;
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    input::placeholder {
      color: #94a3b8;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand-badge">GATRA SECURITY</div>
      <h1>Policy Control Plane</h1>
      <p class="subtitle">Agent Trajectory Security & Policy Management Platform</p>
    </div>

    <div class="card">
      <h2>Active Security Rules</h2>
      <table>
        <thead>
          <tr>
            <th>Rule ID</th>
            <th>Tool Pattern</th>
            <th>Path</th>
            <th>Condition</th>
            <th>Max/Call</th>
            <th>Max/Cum</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="rules-table">
          <tr><td colspan="7">Loading policy rules...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>Add / Update Policy Rule</h2>
      <form id="rule-form">
        <div class="grid">
          <div class="form-group">
            <label>Rule ID</label>
            <input type="text" id="rule_id" placeholder="stripe_refund_policy" required />
          </div>
          <div class="form-group">
            <label>Tool Pattern</label>
            <input type="text" id="tool_pattern" placeholder="stripe/refund" required />
          </div>
        </div>

        <div class="grid">
          <div class="form-group">
            <label>Value Path (JSONPath)</label>
            <input type="text" id="value_path" placeholder="$.amount" required />
          </div>
          <div class="form-group">
            <label>CEL Condition (Optional)</label>
            <input type="text" id="condition" placeholder="payload.currency == 'USD'" />
          </div>
        </div>

        <div class="grid">
          <div class="form-group">
            <label>Max Per Call (Stateless)</label>
            <input type="number" step="0.01" id="max_per_call" placeholder="50.0" />
          </div>
          <div class="form-group">
            <label>Max Cumulative (Stateful)</label>
            <input type="number" step="0.01" id="max_cumulative" placeholder="200.0" />
          </div>
        </div>

        <button type="submit" class="btn">Deploy Policy Rule</button>
      </form>
    </div>
  </div>

  <script>
    async function loadRules() {
      const res = await fetch('/admin/api/policies');
      const data = await res.json();
      const tbody = document.getElementById('rules-table');
      tbody.innerHTML = '';

      if (!data.rules || data.rules.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7">No policy rules active.</td></tr>';
        return;
      }

      data.rules.forEach(rule => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><code>${rule.rule_id}</code></td>
          <td>${rule.tool_pattern}</td>
          <td><code>${rule.value_path}</code></td>
          <td><code>${rule.condition || 'none'}</code></td>
          <td>${rule.limits?.max_per_call ?? 'N/A'}</td>
          <td>${rule.limits?.max_cumulative ?? 'N/A'}</td>
          <td><button class="btn btn-danger" onclick="deleteRule('${rule.rule_id}')">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteRule(ruleId) {
      if (!confirm(`Delete rule '${ruleId}'?`)) return;
      await fetch(`/admin/api/policies?rule_id=${encodeURIComponent(ruleId)}`, { method: 'DELETE' });
      loadRules();
    }

    document.getElementById('rule-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rule = {
        rule_id: document.getElementById('rule_id').value,
        tool_pattern: document.getElementById('tool_pattern').value,
        value_path: document.getElementById('value_path').value,
        condition: document.getElementById('condition').value,
        limits: {},
        accumulator: { type: "sum" }
      };

      const mpc = parseFloat(document.getElementById('max_per_call').value);
      if (!isNaN(mpc)) rule.limits.max_per_call = mpc;

      const mc = parseFloat(document.getElementById('max_cumulative').value);
      if (!isNaN(mc)) rule.limits.max_cumulative = mc;

      await fetch('/admin/api/policies', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(rule)
      });

      document.getElementById('rule-form').reset();
      loadRules();
    });

    loadRules();
  </script>
</body>
</html>
