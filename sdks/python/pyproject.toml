[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gatra-sdk"
version = "0.1.5"
description = "Python SDK for GATRA Zero-Trust Agent Security Proxy & Control Plane"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "GATRA Team", email = "dev@gatra.io" }
]
keywords = ["ai", "agents", "security", "zero-trust", "mcp", "proxy", "ed25519"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=41.0.0"
]

[project.urls]
Homepage = "https://github.com/gatra-io/gatra"
Repository = "https://github.com/gatra-io/gatra"
